# ── Research clusters (/leadership) ──
# themes: key technical themes · outputs: typical activities · orientation: research orientation

- id: cluster-simulation-hpc
  group: cluster
  title: Quantum Simulation & HPC
  description: Simulating quantum systems and quantum circuits on classical high-performance computing resources.
  themes: [State-vector & tensor-network simulation, Quantum chemistry and materials, GPU / HPC acceleration]
  outputs: [Simulation studies, Benchmarking of quantum workloads, Student projects]
  orientation: Computational and applied
  icon: layers
  areas: [quantum-computing]
  order: 1

- id: cluster-hybrid-ai
  group: cluster
  title: Hybrid Quantum Computing & AI
  description: Combining classical machine learning with quantum circuits in hybrid quantum–classical workflows.
  themes: [Variational quantum algorithms, Quantum machine learning, Hybrid optimisation]
  outputs: [Algorithm prototypes, Comparative studies with classical ML, Student projects]
  orientation: Applied and interdisciplinary
  icon: spark
  areas: [quantum-computing, ai-ml]
  order: 2

- id: cluster-algorithms
  group: cluster
  title: Quantum Algorithms & Information Processing
  description: Designing and analysing quantum algorithms and the information-processing principles behind them.
  themes: [Quantum circuits and gates, "Search, factoring and Fourier-based algorithms", Quantum information theory]
  outputs: [Algorithm design and analysis, Circuit implementations on simulators, Teaching material]
  orientation: Foundational
  icon: atom
  areas: [quantum-computing]
  order: 3

- id: cluster-pqc
  group: cluster
  title: Post-Quantum Cryptography
  description: Cryptographic schemes that remain secure against quantum attacks, and their deployment in real networks.
  themes: [Lattice-based cryptography, CRYSTALS-Kyber and standardised algorithms, Migration of network protocols]
  outputs: [Scheme design and analysis, Implementation studies, Publications]
  orientation: Security and applied cryptography
  icon: lattice
  areas: [post-quantum-cryptography]
  order: 4

- id: cluster-qkd
  group: cluster
  title: Quantum Key Distribution & Secure Communication
  description: Quantum-physical key exchange and its integration with classical and post-quantum security.
  themes: [QKD protocols, Quantum channels and photonics, Hybrid QKD + PQC key establishment]
  outputs: [Protocol studies, Demonstration experiments, Teaching demonstrations]
  orientation: Experimental and systems
  icon: photon
  areas: [quantum-key-distribution]
  order: 5

