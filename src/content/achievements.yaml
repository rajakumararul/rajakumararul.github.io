# Awards, fellowships, recognitions and certifications.
#
# kind:      award | fellowship | recognition | certification
# featured:  true → shown under "Honours & awards" on the homepage (awards / fellowships / recognitions)
# order:     display order (lower first)
#
# Optional media (add when available — paths are relative to this file):
#   photo:            ../assets/achievements/<file>.jpg
#   certificateImage: ../assets/achievements/<file>.jpg
#   credentialUrl:    https://…   (public verification link)
#   album:            <gallery album folder name>
#
# Never guess a date — leave `date` out and keep a `verify` note until confirmed.

# ─── Awards & recognition ────────────────────────────────────────────────────

- id: vit-faculty-research-award
  kind: award
  title: Faculty Research Award
  issuer: VIT Chennai
  category: Research Award
  years: [2022, 2023, 2024, 2025]
  description: For sanctioned projects and research publications, four consecutive years.
  featured: true
  order: 1

- id: vit-five-years-service
  kind: recognition
  title: Five Years of Service Award
  issuer: Vellore Institute of Technology (VIT)
  category: Institutional Recognition / Service Award
  description: Recognized by Vellore Institute of Technology for completing five years of dedicated service.
  photo: ./gallery/vit-five-years-service-award/cover.jpg
  album: vit-five-years-service-award
  featured: true
  order: 2
  verify:
    - Award date to be provided
    - Confirm exact award title from the award document

- id: ieee-mas-publication
  kind: award
  title: Publication Award
  issuer: IEEE MAS
  category: Publication Award
  years: [2020]
  description: For a research article in IEEE Transactions on Industrial Informatics.
  featured: true
  order: 3

- id: amrita-chancellor-publication
  kind: award
  title: Chancellor's Publication Award
  issuer: Amrita Innovation and Research Awards
  category: Publication Award
  years: [2020]
  description: For publication in IEEE Transactions.
  featured: true
  order: 4

- id: anna-centenary-fellowship
  kind: fellowship
  title: Anna Centenary Research Fellowship
  issuer: Anna University, Chennai
  category: Doctoral Fellowship
  description: Full-time Ph.D. fellowship.
  featured: true
  order: 5

