  tagline: >-
    Securing the communication networks of today against the quantum computers of tomorrow.
  specializations:
    - Quantum Computing
    - Post-Quantum Cryptography
    - Quantum Key Distribution
    - Network Security
  bio:
    - >-
      Dr. Rajakumar Arul is an Associate Professor and Head of the Department of Quantum
      Computing at VIT Chennai, where he leads the quantum computing initiatives of the
      School of Computer Science and Engineering.
    - >-
      He earned his B.E. and M.E. in Computer Science and Engineering and his Ph.D. in
      Information and Communication Engineering from Anna University, Chennai, where he was
      awarded the Anna Centenary Research Fellowship. His research on authentication, key
      management and quantum-safe security for LTE/5G networks has appeared in IEEE
      Transactions on Industrial Informatics, Springer, Wiley and other leading venues.
    - >-
      He has led and co-led funded research supported by SERB (Government of India), Mitacs
      (Canada) and the MeitY Quantum Computing Applications Lab with AWS. He is a Senior
      Member of IEEE and a Life Member of the Cryptology Research Society of India.
