# Teaching portfolio — /teaching page.
#
# kind: course    → listed under "Current & recent teaching" ONLY when show: true.
# kind: resource  → shown only when url is a public https:// link
#                   resourceType: lab-manual | repository | tool | course | video
# kind: project   → student project themes (never student names or register numbers)

# ── Courses ──

- id: course-qc-fundamentals
  kind: course
  title: Quantum Computing Fundamentals
  description: Qubits, superposition and entanglement, the Bloch sphere, quantum gates and circuits, and programming quantum experiments.
  areas: [quantum-computing]
  order: 1

- id: course-dsa
  kind: course
  title: Data Structures and Algorithms
  description: Core data structures and the algorithms that operate on them, with an emphasis on implementation and complexity.
  order: 2

- id: course-daa
  kind: course
  title: Design and Analysis of Algorithms
  description: Algorithm design paradigms — divide and conquer, greedy, dynamic programming — and the analysis of their correctness and cost.
  order: 3

- id: course-hpc
  kind: course
  title: High Performance Computing
  description: Parallel architectures and programming models for building fast, scalable computational applications.
  order: 4

- id: course-quantum-algorithms
  kind: course
  title: Quantum Algorithms
  description: From Deutsch–Jozsa and Grover's search to the quantum Fourier transform and Shor's algorithm, built and run as circuits.
  areas: [quantum-computing]
  order: 5

- id: course-pqc
  kind: course
  title: Post-Quantum Cryptography
  description: Why quantum computers threaten today's public-key cryptography, and the lattice-based schemes designed to replace it.
  areas: [post-quantum-cryptography]
  order: 6

- id: course-cloud
  kind: course
  title: Cloud Computing
  description: Virtualisation, cloud service models and the design of scalable, secure cloud applications.
  order: 7

- id: course-software-engineering
  kind: course
  title: Software Engineering
  description: Requirements, design, testing and agile practices for building reliable software in teams.
  order: 8

- id: course-devsecops
  kind: course
  title: DevSecOps
  description: Integrating security into continuous integration and delivery pipelines.
  order: 9

