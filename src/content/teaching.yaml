# ── Student project themes ──

- id: proj-bloch-sphere
  kind: project
  title: Physical Quantum Bloch Sphere
  description: A tangible model of the Bloch sphere that shows how gates rotate a single qubit's state.
  areas: [quantum-computing]
  order: 1

- id: proj-circuit-analyser
  kind: project
  title: Quantum Circuit Analyser
  description: A tool that inspects quantum circuits — gates, depth and resulting state probabilities.
  areas: [quantum-computing]
  order: 2

- id: proj-algorithm-visualizer
  kind: project
  title: Quantum Algorithm Visualizer
  description: Step-by-step visualisation of how algorithms such as Deutsch–Jozsa or Grover's search evolve the quantum state.
  areas: [quantum-computing]
  order: 3

- id: proj-qkd-demo
  kind: project
  title: QKD demonstration systems
  description: Demonstrations of quantum key distribution protocols such as BB84, including the effect of an eavesdropper.
  areas: [quantum-key-distribution]
  order: 4

- id: proj-pqc
  kind: project
  title: Post-quantum cryptography projects
  description: Implementations and experiments with lattice-based schemes such as CRYSTALS-Kyber.
  areas: [post-quantum-cryptography]
  order: 5
